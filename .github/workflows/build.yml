name: Generar APK Nexus

on:
  push:
    branches: [ "principal", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Generar Gradle Wrapper si falta
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew no encontrado, generando wrapper..."
            gradle wrapper --gradle-version 9.3.1
            echo "gradlew generado correctamente"
          else
            echo "gradlew ya existe"
          fi

      - name: Crear google-services.json falso (siempre sobrescribe)
        run: |
          mkdir -p app/src/debug
          JSON_CONTENT='{
            "project_info": {
              "project_number": "000000000000",
              "project_id": "nexus-core-v2-fake",
              "storage_bucket": "nexus-core-v2-fake.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.aistudio.sistemapersonal.kxvrmq" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "fake-api-key-for-build" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }'
          echo "$JSON_CONTENT" > app/google-services.json
          echo "$JSON_CONTENT" > app/src/debug/google-services.json
          echo "google-services.json creado en app/ y app/src/debug/"

      - name: Asegurar keystore persistente
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            echo "keystore/debug.keystore no encontrado en repo, restaurando desde backup o creando uno..."
            if [ -f debug.keystore ]; then
              cp debug.keystore keystore/debug.keystore
            elif [ -f keystore/debug.keystore.base64 ]; then
              base64 -d keystore/debug.keystore.base64 > keystore/debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > keystore/debug.keystore
            else
              keytool -genkey -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          echo "keystore listo:"
          ls -la keystore/debug.keystore

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Definir número de versión
        run: echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
